{% extends "base.html" %}
{% block title %}New note — Northroom{% endblock %}
{% block content %}
  <h1>New note</h1>
  <form class="stack" method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}
    <button type="submit">Publish</button>
  </form>
{% endblock %}
