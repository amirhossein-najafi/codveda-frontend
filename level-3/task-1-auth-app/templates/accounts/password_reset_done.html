{% extends "base.html" %}
{% block title %}Check your email — Northroom{% endblock %}
{% block content %}
  <h1>Check your email</h1>
  <p>If an account uses that address, a reset link was created.</p>
  {% if reset_link %}
    <p>This local demo also keeps the link here:</p>
    <p><a class="reset-link" href="{{ reset_link }}">{{ reset_link }}</a></p>
  {% endif %}
{% endblock %}
