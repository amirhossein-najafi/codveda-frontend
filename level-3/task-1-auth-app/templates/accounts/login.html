{% extends "base.html" %}
{% block title %}Log in — Northroom{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <form class="stack" method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}
    <button type="submit">Log in</button>
  </form>
  <p class="meta"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
{% endblock %}
