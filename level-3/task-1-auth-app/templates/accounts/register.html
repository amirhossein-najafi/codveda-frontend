{% extends "base.html" %}
{% block title %}Register — Northroom{% endblock %}
{% block content %}
  <h1>Create an account</h1>
  <form class="stack" method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}
    <button type="submit">Register</button>
  </form>
  <p class="meta">Already registered? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
